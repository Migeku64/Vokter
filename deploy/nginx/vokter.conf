# Nginx — tienda VOKTER (archivos estáticos). vokter-https agrega el bloque HTTPS con certbot.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/vokter;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    include /etc/nginx/snippets/vokter-seguridad.conf;

    # Validación de Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ { allow all; }

    # Nunca se sirven archivos ocultos ni internos, aunque lleguen al servidor por error.
    location ~ /\.                                        { deny all; return 404; }
    location ~* \.(keystore|jks|sql|csv|md|ts|sh|py|env|bak|log)$ { deny all; return 404; }
    location ~* /Data_Comercio                            { deny all; return 404; }

    # Descarga de la app Android.
    location ^~ /descargas/ {
        include /etc/nginx/snippets/vokter-seguridad.conf;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    # Imágenes y fuentes: se guardan una semana en el navegador.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/vokter-seguridad.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Páginas, estilos, scripts y datos: el navegador siempre revisa si hay versión nueva.
    location ~* \.(html|js|css|json|webmanifest)$ {
        include /etc/nginx/snippets/vokter-seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
